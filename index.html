<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd Leaderboard | MAGMA STUDIOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">MAGMA<span>STUDIOS</span></div>
        <p>Official Community Leaderboard & Tier List</p>
    </header>

    <!-- SEARCH BAR -->
    <section class="search-section">
        <div class="search-container">
            <input type="text" id="playerSearch"  placeholder="Search player name...">
        </div>
    </section>

    <!-- FILTER MENUS -->
    <div class="filter-container">
        <!-- Modes -->
        <nav class="filter-menu" id="modo-menu">
            <button class="filter-btn active" data-mode="overall">🏆 OVERALL</button>
            <button class="filter-btn" data-mode="sword">⚔️ SWORD</button>
            <button class="filter-btn" data-mode="enchanted">✨ ENCHANTED</button>
            <button class="filter-btn" data-mode="skywars">☁️ SKYWARS</button>
            <button class="filter-btn" data-mode="bedwars">🛏️ BEDWARS</button>
            <button class="filter-btn" data-mode="pot">🧪 POT</button>
            <button class="filter-btn" data-mode="hole">🕳️ HOLE</button>
            <button class="filter-btn" data-mode="uhc">🍎 UHC</button>
            <button class="filter-btn" data-mode="soup">🍲 SOUP</button>
            <button class="filter-btn" data-mode="parkour">🏃 PARKOUR</button>
        </nav>

        <!-- Regions -->
        <nav class="filter-menu" id="region-menu">
            <button class="filter-btn active" data-region="ALL">ALL</button>
            <button class="filter-btn" data-region="NA">NA</button>
            <button class="filter-btn" data-region="EU">EU</button>
            <button class="filter-btn" data-region="AS">AS</button>
            <button class="filter-btn" data-region="SA">SA</button>
            <button class="filter-btn" data-region="AF">AF</button>
            <button class="filter-btn" data-region="AU">AU</button>
        </nav>
    </div>

    <!-- AUTOMATIC PODIUM -->
    <section class="podium-container">
        <div class="podium-box rank-2">
            <div class="podium-avatar">👤</div>
            <div class="podium-name" id="name-2">-</div>
            <div class="podium-points" id="points-2">0 pts</div>
            <div class="podium-step">2</div>
        </div>
        <div class="podium-box rank-1">
            <div class="podium-avatar">👑</div>
            <div class="podium-name" id="name-1">-</div>
            <div class="podium-points" id="points-1">0 pts</div>
            <div class="podium-step">1</div>
        </div>
        <div class="podium-box rank-3">
            <div class="podium-avatar">👤</div>
            <div class="podium-name" id="name-3">-</div>
            <div class="podium-points" id="points-3">0 pts</div>
            <div class="podium-step">3</div>
        </div>
    </section>

    <!-- LEADERBOARD TABLE WITH AVATAR COLUMN -->
    <main class="leaderboard-container">
        <table>
            <thead>
                <tr>
                    <th># Rank</th>
                    <th>Avatar</th>
                    <th>Player</th>
                    <th>Region</th>
                    <th>Points</th>
                    <th>Ranks & Points / Tier</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <!-- JavaScript handles this dynamically -->
            </tbody>
        </table>
    </main>

    <!-- CONFIGURADO COMO MÓDULO PARA EL FUTURO SCRIPT DE FIREBASE -->
    <script type="module" src="script.js"></script>
</body>
</html>
